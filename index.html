
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        id="scene"
        embedded
        gesture-detector
    >
        <a-assets>
            <a-asset-item
                id="animated-asset"
                src="assets/asset.glb"
            ></a-asset-item>
        </a-assets>

        <a-marker
            id="animated-marker"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
            <a-entity
                id="bowser-model"
                scale="1.0213097738093087 1.0213097738093087 1.0213097738093087"
                animation-mixer="loop: repeat"
                gltf-model="#animated-asset"
                class="clickable"
                gesture-handler
            ></a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <div style="
        position: fixed;
        bottom: 3%;
        left: 5%;
        width: 90%;
        box-sizing: border-box;
        padding: 2.5vw;
        background: rgba(0, 75, 50, 0.92);
        color: white;
        border: 2px solid white;
        border-radius: 12px;
        font-family: Arial, sans-serif;
        text-align: center;
        z-index: 99999;
        pointer-events: none;
    ">
        <div style="font-size: 4vw; font-weight: bold;">
            EDIFICIO B
        </div>

        <div style="font-size: 3.5vw; font-weight: bold; margin-top: 8px;">
            Ingeniería en Computación (ICO)
        </div>

        <div style="font-size: 3vw; margin-top: 8px;">
            Carrera enfocada en la programación,
            desarrollo de software, redes,
            sistemas computacionales e inteligencia
            artificial para la solución de problemas
            mediante la tecnología.
        </div>
    </div>

</body>
</html>

</html>
