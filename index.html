
<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Edificio B - ICO</title>

        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <style>
            #nota-ico {
                display: none;
                position: fixed;
                bottom: 3%;
                left: 5%;
                width: 90%;
                box-sizing: border-box;
                padding: 2vw;
                background: rgba(0, 75, 45, 0.95);
                color: white;
                border: 2px solid white;
                border-radius: 12px;
                font-family: Arial, sans-serif;
                text-align: center;
                z-index: 2147483647;
                pointer-events: none;
            }

            #nota-ico h2 {
                font-size: 4vw;
                margin: 0 0 8px;
            }

            #nota-ico h3 {
                font-size: 3.5vw;
                margin: 0 0 8px;
            }

            #nota-ico p {
                font-size: 3vw;
                line-height: 1.4;
                margin: 0;
            }
        </style>
    </head>

    <body style="margin: 0; overflow: hidden;">

        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="bowser-model"
                    scale="1.0213097738093087 1.0213097738093087 1.0213097738093087"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>

        </a-scene>

        <div id="nota-ico">
            <h2>EDIFICIO B</h2>

            <h3>Ingeniería en Computación (ICO)</h3>

            <p>
                Carrera orientada al desarrollo de software,
                programación, redes, inteligencia artificial
                y sistemas computacionales para la solución
                de problemas mediante la tecnología.
            </p>
        </div>

        <script>
            (function () {

                var marcador = document.getElementById(
                    "animated-marker"
                );

                var nota = document.getElementById(
                    "nota-ico"
                );

                marcador.addEventListener(
                    "markerFound",
                    function () {
                        nota.style.display = "block";
                    }
                );

                marcador.addEventListener(
                    "markerLost",
                    function () {
                        nota.style.display = "none";
                    }
                );

                setInterval(function () {

                    if (marcador.object3D) {

                        nota.style.display =
                            marcador.object3D.visible
                            ? "block"
                            : "none";

                    }

                }, 150);

            })();
        </script>

    </body>
</html>
