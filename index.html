
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edificio B - ICO</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #informacion {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 5%;
            width: 90%;
            box-sizing: border-box;
            padding: 18px;
            background: rgba(0, 65, 45, 0.92);
            color: white;
            border: 2px solid white;
            border-radius: 12px;
            z-index: 9999;
            text-align: center;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        h3 {
            margin: 5px 0;
            font-size: 17px;
        }

        p {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div id="informacion">
        <h2>EDIFICIO B</h2>
        <h3>Ingenieria en Computacion (ICO)</h3>
        <p>
            Carrera enfocada en el desarrollo de software,
            programacion, redes, sistemas computacionales
            e inteligencia artificial, aplicando la tecnologia
            para solucionar problemas de la sociedad.
        </p>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        id="scene"
        embedded
        gesture-detector>

        <a-assets>
            <a-asset-item
                id="animated-asset"
                src="assets/asset.glb">
            </a-asset-item>
        </a-assets>

        <a-light
            type="ambient"
            color="#FFFFFF"
            intensity="1.8">
        </a-light>

        <a-light
            type="directional"
            color="#FFFFFF"
            intensity="2"
            position="2 5 3">
        </a-light>

        <a-marker
            id="markerA"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;">

            <a-entity
                id="bowser-model"
                scale="1.0213 1.0213 1.0213"
                animation-mixer="loop: repeat"
                gltf-model="#animated-asset"
                class="clickable"
                gesture-handler>
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const marcador = document.querySelector("#markerA");
        const panel = document.querySelector("#informacion");

        marcador.addEventListener("markerFound", function () {
            panel.style.display = "block";
        });

        marcador.addEventListener("markerLost", function () {
            panel.style.display = "none";
        });
    </script>

</body>
</html>
